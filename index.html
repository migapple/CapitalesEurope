  <style>
    :root {
      --ink:    #0e0e0e; --ink2: #1a1a1a; --ink3: #252525; --ink4: #2e2e2e;
      --gold:   #c9a84c; --gold2: #e2c47a;
      --text:   #e8dfc8; --text2: #b5a98a; --text3: #7a6e57;
      --radius: 12px;
      --safe-top:    env(safe-area-inset-top, 44px);
      --safe-bottom: env(safe-area-inset-bottom, 34px);
      --hh: calc(62px + var(--safe-top));
      --nh: calc(52px + var(--safe-bottom));
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: var(--ink); color: var(--text);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── HEADER ── */
    #hdr {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--hh); padding-top: var(--safe-top);
      background: var(--ink2); border-bottom: 1px solid var(--ink4);
      display: flex; align-items: center; justify-content: space-between;
      padding-left: 18px; padding-right: 14px;
    }
    .hdr-left { display: flex; flex-direction: column; }
    .app-title { font-family: 'IM Fell English', serif; font-size: 21px; color: var(--gold2); letter-spacing: .02em; line-height: 1; }
    .app-subtitle { font-size: 11px; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
    .hdr-right { display: flex; gap: 8px; align-items: center; }
    .hbtn { background: var(--ink3); border: 1px solid var(--ink4); border-radius: 18px; height: 34px; min-width: 34px; padding: 0 10px; color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .hbtn:active { opacity: .6; transform: scale(.94); }

    /* ── MAIN ── */
    #main {
      position: fixed;
      top: var(--hh); bottom: var(--nh);
      left: 0; right: 0;
      overflow: hidden;
    }

    /* ── VIEWS — pattern exact Musées de Paris ── */
    .view {
      position: absolute; inset: 0;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      opacity: 0; pointer-events: none;
      transform: translateY(6px);
      transition: opacity .26s, transform .26s;
    }
    .view.on { opacity: 1; pointer-events: auto; transform: none; }
    #vmap { overflow: hidden !important; overflow-y: hidden !important; }
    #mainMap { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }

    /* ── SEARCH + PILLS ── */
    .swrap { padding: 12px 16px 0; position: sticky; top: 0; z-index: 5; background: var(--ink); }
    .search-wrap { position: relative; margin-bottom: 10px; }
    .search-wrap::before { content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: .5; pointer-events: none; }
    #searchInput { width: 100%; height: 42px; background: var(--ink2); border: 1px solid var(--ink4); border-radius: 10px; padding: 0 12px 0 34px; color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 16px; outline: none; transition: border-color .2s; -webkit-appearance: none; }
    #searchInput:focus { border-color: var(--gold); }
    #searchInput::placeholder { color: var(--text3); }
    .pills-wrap { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; scrollbar-width: none; }
    .pills-wrap::-webkit-scrollbar { display: none; }
    .pill { flex-shrink: 0; padding: 5px 14px; border-radius: 20px; background: var(--ink2); border: 1px solid var(--ink4); color: var(--text2); font-family: 'Cormorant Garamond', serif; font-size: 14px; cursor: pointer; transition: all .2s; white-space: nowrap; }
    .pill.active { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }

    /* ── CARD LIST ── */
    #cardListWrap { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
    .counter-text { font-size: 11px; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; padding: 0 2px 2px; display: block; }
    .card { background: var(--ink2); border: 1px solid var(--ink4); border-radius: var(--radius); display: flex; align-items: stretch; overflow: hidden; cursor: pointer; transition: transform .15s, border-color .15s; }
    .card:active { transform: scale(.975); border-color: var(--gold); }
    .card-img { width: 88px; min-height: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; position: relative; overflow: hidden; border-right: 1px solid var(--ink4); }
    .card-img .wiki-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    .card-body { flex: 1; padding: 11px 13px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .card-name { font-family: 'IM Fell English', serif; font-size: 18px; color: var(--gold2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .card-country { font-size: 13px; color: var(--text3); margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: var(--text2); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { display: flex; gap: 8px; margin-top: 5px; align-items: center; }
    .card-region { font-size: 11px; color: var(--gold); border: 1px solid var(--gold); border-radius: 10px; padding: 1px 7px; letter-spacing: .05em; text-transform: uppercase; }

    /* ── MAP ── */
    #mainMap { width: 100%; height: 100%; }
    .leaflet-tile-pane { filter: brightness(.85) saturate(.8); }
    .leaflet-popup-content-wrapper { background: var(--ink2) !important; border: 1px solid var(--ink4) !important; border-radius: 10px !important; color: var(--text) !important; box-shadow: 0 4px 20px rgba(0,0,0,.5) !important; }
    .leaflet-popup-tip { background: var(--ink2) !important; }
    .leaflet-popup-content { margin: 10px 14px !important; font-family: 'Cormorant Garamond', serif !important; font-size: 15px !important; }
    .map-popup-title { font-family: 'IM Fell English', serif; color: var(--gold2); font-size: 17px; margin-bottom: 2px; }
    .map-popup-sub { color: var(--text3); font-size: 13px; margin-bottom: 6px; }
    .map-popup-btn { display: inline-block; background: var(--gold); color: var(--ink); border-radius: 8px; padding: 4px 12px; font-size: 13px; cursor: pointer; font-weight: 600; }
    .custom-marker { background: var(--gold); border: 2px solid var(--ink); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 17px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
    .hl-marker { background: var(--ink2); border: 2px solid var(--gold); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 15px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }

    /* ── NAV BAR ── */
    #nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      height: var(--nh); padding-bottom: var(--safe-bottom);
      background: var(--ink2); border-top: 1px solid var(--ink4);
      display: flex; align-items: flex-start; justify-content: space-around;
    }
    .nb { flex: 1; height: 52px; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--text3); transition: color .18s; }
    .nb.on { color: var(--gold); }
    .nb:active { opacity: .65; }
    .nb-icon { font-size: 22px; line-height: 1; }
    .nb-label { font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

    /* ── MODAL DETAIL ── */
    .view#vdetail { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .modal-close-strip { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--ink); border-bottom: 1px solid var(--ink4); cursor: pointer; }
    .modal-close-lbl { font-size: 15px; color: var(--gold); font-weight: 500; }
    .modal-hero { width: 100%; height: 210px; background: var(--ink3); display: flex; align-items: center; justify-content: center; font-size: 60px; position: relative; overflow: hidden; flex-shrink: 0; }
    .modal-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    .modal-hero-grad { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, var(--ink) 100%); z-index: 1; }
    #miniMap { width: 100%; height: 180px; background: var(--ink3); flex-shrink: 0; }
    .modal-body { padding: 16px 18px 40px; }
    .modal-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .modal-flag { font-size: 30px; }
    .modal-name { font-family: 'IM Fell English', serif; font-size: 26px; color: var(--gold2); line-height: 1; }
    .modal-country { font-size: 15px; color: var(--text3); margin-bottom: 8px; }
    .modal-region-badge { display: inline-block; font-size: 12px; color: var(--gold); border: 1px solid var(--gold); border-radius: 12px; padding: 2px 10px; margin-bottom: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .modal-desc { font-size: 15px; color: var(--text); line-height: 1.65; margin-bottom: 14px; font-style: italic; }
    .modal-section-title { font-family: 'IM Fell English', serif; font-size: 14px; color: var(--gold); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; margin-top: 14px; }
    .modal-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
    .fact-box { background: var(--ink3); border-radius: 10px; padding: 10px 12px; }
    .fact-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
    .fact-value { font-size: 14px; color: var(--text); font-weight: 600; }
    .modal-divider { height: 1px; background: var(--ink4); margin: 12px 0; }
    .highlights-list { list-style: none; }
    .highlight-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--ink3); }
    .highlight-item:last-child { border-bottom: none; }
    .hi-thumb { width: 58px; height: 58px; flex-shrink: 0; border-radius: 8px; background: var(--ink3); display: flex; align-items: center; justify-content: center; font-size: 22px; overflow: hidden; position: relative; border: 1px solid var(--ink4); }
    .hi-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; border-radius: 7px; }
    .hi-text { font-size: 14px; color: var(--text2); line-height: 1.3; flex: 1; }

    /* ── SETTINGS ── */
    .sov { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.55); display: none; align-items: flex-end; }
    .sov.on { display: flex; }
    .sht { width: 100%; background: var(--ink2); border-top: 1px solid var(--ink4); border-radius: 20px 20px 0 0; padding-bottom: var(--safe-bottom); transform: translateY(100%); transition: transform .32s cubic-bezier(.4,0,.2,1); }
    .sov.on .sht { transform: none; }
    .shd { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; border-bottom: 1px solid var(--ink4); }
    .sttl { font-family: 'IM Fell English', serif; font-size: 20px; color: var(--gold2); }
    .sclose { background: var(--ink3); border: 1px solid var(--ink4); color: var(--text2); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; }
    .srow { display: flex; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--ink3); }
    .srow:last-child { border-bottom: none; }
    .srow-label { flex: 1; font-size: 15px; color: var(--text); }
    .srow-val { font-size: 13px; color: var(--text3); }
    .srow-arr { font-size: 13px; color: var(--text3); }
    .nos-apps-scroll { display: flex; gap: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 12px 20px 16px; scrollbar-width: none; }
    .nos-apps-scroll::-webkit-scrollbar { display: none; }
    .app-chip { flex-shrink: 0; background: var(--ink3); border: 1px solid var(--ink4); border-radius: 12px; padding: 10px 14px; text-align: center; cursor: pointer; text-decoration: none; min-width: 90px; }
    .app-chip-icon { font-size: 24px; display: block; margin-bottom: 4px; }
    .app-chip-name { font-size: 11px; color: var(--text2); line-height: 1.2; }

    /* ── EMPTY ── */
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 30px; color: var(--text3); text-align: center; gap: 12px; }
    .empty-icon { font-size: 48px; }
    .empty-text { font-size: 16px; font-style: italic; }
    #emptyState { display: none; }
    #emptyState.show { display: flex; }

    /* ── QUIZ ── */
    #vquiz { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .quiz-wrap { padding: 20px 18px 40px; max-width: 540px; margin: 0 auto; }
    .quiz-header { text-align: center; margin-bottom: 24px; }
    .quiz-title { font-family: 'IM Fell English', serif; font-size: 26px; color: var(--gold2); margin-bottom: 6px; }
    .quiz-subtitle { font-size: 14px; color: var(--text3); }
    .quiz-score-bar { display: flex; justify-content: space-between; align-items: center; background: var(--ink3); border-radius: 12px; padding: 10px 16px; margin-bottom: 20px; }
    .quiz-score-item { text-align: center; }
    .quiz-score-num { font-family: 'IM Fell English', serif; font-size: 26px; color: var(--gold2); line-height: 1; }
    .quiz-score-lbl { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
    .quiz-progress { height: 4px; background: var(--ink4); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
    .quiz-progress-bar { height: 100%; background: var(--gold); border-radius: 2px; transition: width .4s; }
    .quiz-question-card { background: var(--ink2); border: 1px solid var(--ink4); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .quiz-type-badge { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
    .quiz-flag { font-size: 52px; text-align: center; display: block; margin: 8px 0 14px; }
    .quiz-question { font-family: 'IM Fell English', serif; font-size: 20px; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
    .quiz-choices { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .quiz-choice { background: var(--ink3); border: 2px solid var(--ink4); border-radius: 12px; padding: 13px 16px; cursor: pointer; font-family: 'Cormorant Garamond', serif; font-size: 17px; color: var(--text); transition: all .18s; text-align: left; width: 100%; -webkit-tap-highlight-color: transparent; }
    .quiz-choice:active { transform: scale(.97); }
    .quiz-choice.correct { background: rgba(80,180,80,.15); border-color: #50b450; color: #80e080; }
    .quiz-choice.wrong   { background: rgba(200,70,70,.15);  border-color: #c84646; color: #e08080; }
    .quiz-choice.reveal  { opacity: .55; }
    .quiz-feedback { text-align: center; font-size: 15px; margin-top: 14px; min-height: 24px; color: var(--text2); font-style: italic; }
    .quiz-next-btn { width: 100%; margin-top: 16px; padding: 14px; background: var(--gold); color: var(--ink); border: none; border-radius: 12px; font-family: 'IM Fell English', serif; font-size: 18px; cursor: pointer; display: none; -webkit-tap-highlight-color: transparent; }
    .quiz-next-btn.show { display: block; }
    .quiz-end { text-align: center; padding: 30px 0; }
    .quiz-end-emoji { font-size: 64px; display: block; margin-bottom: 16px; }
    .quiz-end-score { font-family: 'IM Fell English', serif; font-size: 48px; color: var(--gold2); }
    .quiz-end-label { font-size: 16px; color: var(--text3); margin-bottom: 24px; }
    .quiz-restart { background: var(--gold); color: var(--ink); border: none; border-radius: 12px; padding: 14px 32px; font-family: 'IM Fell English', serif; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>

<header id="hdr">
  <div class="hdr-left">
    <div class="app-title" id="appTitle">Capitales d'Europe</div>
    <div class="app-subtitle" id="appSubtitle">Guide touristique · 40 capitales</div>
  </div>
  <div class="hdr-right">
    <button class="hbtn" id="btnLang" onclick="toggleLang()">🇬🇧 EN</button>
    <button class="hbtn" onclick="openSettings()">⚙️</button>
  </div>
</header>

<main id="main">
  <!-- LIST VIEW -->
  <div id="vlist" class="view on">
    <div class="swrap">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Rechercher…" autocomplete="off" autocorrect="off" spellcheck="false" oninput="renderList()"/>
      </div>
      <div class="pills-wrap" id="pillsWrap"></div>
    </div>
    <div id="cardListWrap">
      <span class="counter-text" id="counterText"></span>
      <div id="cardList"></div>
      <div id="emptyState">
        <div class="empty-icon">🗺️</div>
        <div class="empty-text" id="emptyText">Aucune capitale trouvée</div>
      </div>
    </div>
  </div>

  <!-- MAP VIEW -->
  <div id="vmap" class="view">
    <div id="mainMap"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="vdetail" class="view">
    <div id="detailInner"></div>
  </div>

  <!-- QUIZ VIEW -->
  <div id="vquiz" class="view">
    <div class="quiz-wrap" id="quizWrap"></div>
  </div>
</main>

<nav id="nav">
  <button class="nb on" id="nbListe" onclick="goTo('liste')">
    <span class="nb-icon">📋</span>
    <span class="nb-label" id="nbListeLabel">Liste</span>
  </button>
  <button class="nb" id="nbCarte" onclick="goTo('carte')">
    <span class="nb-icon">🗺️</span>
    <span class="nb-label" id="nbCarteLabel">Carte</span>
  </button>
  <button class="nb" id="nbQuiz" onclick="goTo('quiz')">
    <span class="nb-icon">🧠</span>
    <span class="nb-label" id="nbQuizLabel">Quiz</span>
  </button>
</nav>

<!-- SETTINGS -->
<div class="sov" id="settingsOverlay" onclick="closeSettings(event)">
  <div class="sht">
    <div class="shd">
      <span class="sttl" id="settTitle">Réglages</span>
      <button class="sclose" onclick="document.getElementById('settingsOverlay').classList.remove('on')">✕</button>
    </div>
    <div class="srow"><span class="srow-label" id="settAboutLabel">À propos</span><span class="srow-val">1.1</span></div>
    <div class="srow"><span class="srow-label">© Michel Garlandat 2026</span></div>
    <div class="srow"><span class="srow-label" id="settMadeWith">Fait avec Anthropic Claude</span></div>
    <div class="srow"><span class="srow-label" id="settPrivacy">Données</span><span class="srow-val" id="settNoData">Aucune collectée</span></div>
    <div class="srow" onclick="window.open('https://migapple.github.io','_blank')" style="cursor:pointer">
      <span class="srow-label" id="settPrivacyLink">Politique de confidentialité</span><span class="srow-arr">›</span>
    </div>
    <div style="padding:12px 20px 4px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em" id="settOtherApps">Nos autres apps</div>
    <div class="nos-apps-scroll" id="nosAppsScroll"></div>
  </div>
</div>

<script>

/* ═══════════════════════════════════════════════
   WIKIPEDIA PHOTOS
═══════════════════════════════════════════════ */
function loadWikiImg(imgEl, title, cachePrefix) {
  if (!title || !imgEl) return;
  var key = (cachePrefix||"wiki_") + title;
  var cached = imgCache[key] || localStorage.getItem(key);
  if (cached) { imgCache[key] = cached; showImg(imgEl, cached); return; }
  fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var url = (d.originalimage && d.originalimage.source) || (d.thumbnail && d.thumbnail.source) || "";
      if (url) {
        imgCache[key] = url;
        try { localStorage.setItem(key, url); } catch(e){}
        showImg(imgEl, url);
      }
    }).catch(function(){});
}

function showImg(imgEl, url) {
  imgEl.src = url;
  imgEl.style.display = "block";
}

function goTo(view, capital) {
  // Cacher toutes les vues
  document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("on"); });
  document.querySelectorAll(".nb").forEach(function(b){ b.classList.remove("on"); });

  activeView = view;

  if (view === "liste") {
    document.getElementById("vlist").classList.add("on");
    document.getElementById("nbListe").classList.add("on");
  } else if (view === "carte") {
    document.getElementById("vmap").classList.add("on");
    document.getElementById("nbCarte").classList.add("on");
    if (!mainMapDone) {
      mainMapDone = true;
      setTimeout(function(){
        initMainMap();
      }, 80);
    } else {
      setTimeout(function(){ if (mainMap) mainMap.invalidateSize(); }, 80);
    }
  } else if (view === "detail" && capital) {
    currentCapital = capital;
    document.getElementById("vdetail").classList.add("on");
    renderDetail(capital);
    document.getElementById("vdetail").scrollTop = 0;
  } else if (view === "quiz") {
    document.getElementById("vquiz").classList.add("on");
    document.getElementById("nbQuiz").classList.add("on");
    if (!quizStarted) startQuiz();
  }
}

   MAIN MAP
═══════════════════════════════════════════════ */
function initMainMap() {
  var container = document.getElementById("mainMap");
  if (!container) { console.error("mainMap container not found"); return; }
  if (typeof L === "undefined") { console.error("Leaflet not loaded"); return; }
  // Désactiver les icônes par défaut Leaflet (évite les 404 sur les PNG)
  delete L.Icon.Default.prototype._getIconUrl;
  L.Icon.Default.mergeOptions({iconUrl:"", shadowUrl:"", iconRetinaUrl:""});
  mainMap = L.map(container, {center:[50, 15], zoom:4, zoomControl:true, attributionControl:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution:"", maxZoom:19
  }).addTo(mainMap);

  CAPITALES.forEach(function(c) {
    var icon = L.divIcon({
      className:"", html:"<div class='custom-marker'>"+c.flag+"</div>",
      iconSize:[32,32], iconAnchor:[16,16], popupAnchor:[0,-18]
    });
    var marker = L.marker([c.lat, c.lng], {icon:icon}).addTo(mainMap);
    var u = UI[lang];
    marker.bindPopup(
      "<div class='map-popup-title'>"+c.nom[lang]+"</div>"+
      "<div class='map-popup-sub'>"+c.pays[lang]+"</div>"+
      "<div class='map-popup-btn' onclick='openModal("+c.id+")'>"+
      (lang==="fr"?"Découvrir →":"Explore →")+"</div>",
      {maxWidth:180, minWidth:150}
    );
    mainMapMarkers.push({c:c, marker:marker});
  });
}

/* ═══════════════════════════════════════════════
   MINI MAP
═══════════════════════════════════════════════ */
function initMiniMap() {
  // miniMap créé à la demande dans updateMiniMap
}

function updateMiniMap(capital) {
  // Détruire et recréer à chaque fois pour éviter les bugs de taille
  if (miniMap) { try { miniMap.remove(); } catch(e){} miniMap = null; }
  miniMapMarkers = [];
  var container = document.getElementById("miniMap");
  container.innerHTML = "";
  miniMap = L.map(container, {
    zoomControl:false, attributionControl:false,
    scrollWheelZoom:false, dragging:true, touchZoom:true
  });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution:"", maxZoom:19
  }).addTo(miniMap);

  var capIcon = L.divIcon({
    className:"", html:"<div class='custom-marker'>"+capital.flag+"</div>",
    iconSize:[32,32], iconAnchor:[16,16]
  });
  var capMarker = L.marker([capital.lat, capital.lng], {icon:capIcon}).addTo(miniMap);
  miniMapMarkers.push(capMarker);

  capital.hl.forEach(function(h) {
    var hlIcon = L.divIcon({
      className:"", html:"<div class='hl-marker'>"+h.emoji+"</div>",
      iconSize:[28,28], iconAnchor:[14,14]
    });
    var m = L.marker([h.lat, h.lng], {icon:hlIcon}).addTo(miniMap);
    m.bindTooltip(lang==="fr"?h.fr:h.en, {permanent:false, direction:"top"});
    miniMapMarkers.push(m);
  });

  // Zoom sur la capitale avec niveau fixe, puis fitBounds si les highlights sont dispersés
  miniMap.setView([capital.lat, capital.lng], 13);
  var lats = capital.hl.map(function(h){return h.lat;}).concat([capital.lat]);
  var lngs = capital.hl.map(function(h){return h.lng;}).concat([capital.lng]);
  var latSpan = Math.max.apply(null,lats) - Math.min.apply(null,lats);
  var lngSpan = Math.max.apply(null,lngs) - Math.min.apply(null,lngs);
  if (latSpan > 0.15 || lngSpan > 0.15) {
    // Highlights dispersés : adapter le zoom
    var bounds = L.latLngBounds(
      [Math.min.apply(null,lats)-0.02, Math.min.apply(null,lngs)-0.02],
      [Math.max.apply(null,lats)+0.02, Math.max.apply(null,lngs)+0.02]
    );
    miniMap.fitBounds(bounds, {padding:[15,15], maxZoom:13});
  }
}

/* OSM tile coords from lat/lng */
var REGION_BG = {
  NORD:   "linear-gradient(135deg,#1b6ca8,#48b1e5)",
  OUEST:  "linear-gradient(135deg,#1a7a3a,#4dc97a)",
  CENTRE: "linear-gradient(135deg,#7a5a10,#d4a030)",
  EST:    "linear-gradient(135deg,#8a1a1a,#d44040)",
  SUD:    "linear-gradient(135deg,#5a1a8a,#a040d0)"
};
function regionBg(region) {
  return REGION_BG[region] || "linear-gradient(135deg,#334,#668)";
}

function norm(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}

function renderPills() {
  var u = UI[lang];
  document.getElementById("pillsWrap").innerHTML = REGION_KEYS.map(function(k){

  }).join("");
}

/* ═══════════════════════════════════════════════

═══════════════════════════════════════════════ */
function renderList() {
  var q = norm(document.getElementById("searchInput").value.trim());
  var list = CAPITALES.filter(function(c){
    var mp = activePill==="ALL" || c.region===activePill;
    var mq = !q || norm(c.nom[lang]).includes(q) || norm(c.pays[lang]).includes(q) || norm(c.desc[lang]).includes(q);
    return mp && mq;
  });
  var u = UI[lang];
  document.getElementById("counterText").textContent = u.found(list.length);
  document.getElementById("emptyText").textContent = u.none;
  var emptyEl = document.getElementById("emptyState");
  var cardListEl = document.getElementById("cardList");
  emptyEl.style.display = "none";
  cardListEl.innerHTML = "";
  if (!list.length) {
    emptyEl.style.display = "flex";
    return;
  }
  list.forEach(function(c){
    // Créer la carte sans innerHTML imbriqué
    var card = document.createElement("div");
    card.className = "card";
    card.onclick = (function(cap){ return function(){ goTo("detail", cap); }; })(c);

    // Vignette image
    var imgDiv = document.createElement("div");
    imgDiv.className = "card-img";
    imgDiv.id = "cimg" + c.id;
    imgDiv.style.background = regionBg(c.region);
    var flagSpan = document.createElement("span");
    flagSpan.textContent = c.flag;
    var wikiImg = document.createElement("img");
    wikiImg.className = "wiki-img";
    wikiImg.alt = "";
    imgDiv.appendChild(flagSpan);
    imgDiv.appendChild(wikiImg);

    // Corps
    var body = document.createElement("div");
    body.className = "card-body";

    var head = document.createElement("div");
    head.className = "card-head";
    var name = document.createElement("span");
    name.className = "card-name";
    name.textContent = c.nom[lang];
    head.appendChild(name);

    var country = document.createElement("div");
    country.className = "card-country";
    country.textContent = c.pays[lang];

    var desc = document.createElement("div");
    desc.className = "card-desc";
    desc.textContent = c.desc[lang];

    var meta = document.createElement("div");
    meta.className = "card-meta";
    var region = document.createElement("span");
    region.className = "card-region";
    region.textContent = u.region(c.region);
    var pop = document.createElement("span");
    pop.className = "card-pop";
    pop.textContent = "👥 " + c.pop;
    meta.appendChild(region);
    meta.appendChild(pop);

    body.appendChild(head);
    body.appendChild(country);
    body.appendChild(desc);
    body.appendChild(meta);

    card.appendChild(imgDiv);
    card.appendChild(body);
    cardListEl.appendChild(card);

    // Charger l'image Wikipedia
    loadWikiImg(wikiImg, c.wikiEn, "wiki_");
  });
}

      "<div class='map-popup-sub'>"+item.c.pays[lang]+"</div>"+
      "<div class='map-popup-btn' onclick=\"goTo('detail',CAPITALES.find(function(x){return x.id==="+item.c.id+";}))\">"+
      (lang==="fr"?"Découvrir →":"Explore →")+"</div>"
    );
  });
  if (currentCapital && activeView === "detail") renderDetail(currentCapital);
}

function setPill(key) {
  activePill = key;
  renderPills();
  renderList();
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */

function buildNosApps() {
  document.getElementById("nosAppsScroll").innerHTML = NOS_APPS.map(function(a){
    return "<a class='app-chip' href='https://apps.apple.com/app/"+a.id+"' target='_blank'>" +
      "<span class='app-chip-icon'>"+a.icon+"</span><span class='app-chip-name'>"+a.nom+"</span></a>";
  }).join("");
}

function closeSettings(e) { if (e.target===document.getElementById("settingsOverlay")) document.getElementById("settingsOverlay").classList.remove("on"); }

/* ═══════════════════════════════════════════════
   QUIZ ENGINE
═══════════════════════════════════════════════ */
var quizStarted = false;
var quizQuestions = [];
var quizIndex = 0;
var quizScore = 0;
var quizBestScore = parseInt(localStorage.getItem("quiz_best") || "0");
var quizAnswered = false;
var QUIZ_TOTAL = 12;

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function generateQuestions() {
  var qs = [];
  var caps = shuffle(CAPITALES).slice(0, QUIZ_TOTAL);
  caps.forEach(function(c, idx) {
    var type = idx % 3; // 0=capitale→pays, 1=pays→capitale, 2=drapeau→capitale
    var wrongPool = CAPITALES.filter(function(x){ return x.id !== c.id; });
    var wrongs = shuffle(wrongPool).slice(0, 3);
    var question, flag, choices, correctIdx;

    if (type === 0) {
      // Quelle est la capitale de [pays] ?
      question = lang === "fr"
        ? "Quelle est la capitale de " + c.pays["fr"] + " ?"
        : "What is the capital of " + c.pays["en"] + "?";
      flag = "";
      choices = shuffle([c].concat(wrongs)).map(function(x){ return x.nom[lang]; });
      correctIdx = choices.indexOf(c.nom[lang]);
    } else if (type === 1) {
      // De quel pays est la capitale [ville] ?
      question = lang === "fr"
        ? c.nom["fr"] + " est la capitale de quel pays ?"
        : "Which country has " + c.nom["en"] + " as its capital?";
      flag = "";
      choices = shuffle([c].concat(wrongs)).map(function(x){ return x.pays[lang]; });
      correctIdx = choices.indexOf(c.pays[lang]);
    } else {
      // Quel pays représente ce drapeau ?
      question = lang === "fr" ? "À quel pays correspond ce drapeau ?" : "Which country does this flag represent?";
      flag = c.flag;
      choices = shuffle([c].concat(wrongs)).map(function(x){ return x.pays[lang]; });
      correctIdx = choices.indexOf(c.pays[lang]);
    }

    qs.push({ capital: c, type: type, question: question, flag: flag, choices: choices, correctIdx: correctIdx });
  });
  return qs;
}

function startQuiz() {
  quizStarted = true;
  quizIndex = 0;
  quizScore = 0;
  quizAnswered = false;
  quizQuestions = generateQuestions();
  renderQuizQuestion();
}

function renderQuizQuestion() {
  var u = UI[lang];
  var wrap = document.getElementById("quizWrap");
  if (!wrap) return;

  if (quizIndex >= quizQuestions.length) {
    renderQuizEnd();
    return;
  }

  var q = quizQuestions[quizIndex];
  quizAnswered = false;

  var pct = Math.round(quizIndex / quizQuestions.length * 100);
  var rank = quizScore >= 10 ? 3 : quizScore >= 7 ? 2 : quizScore >= 4 ? 1 : 0;

  wrap.innerHTML =
    "<div class=\"quiz-header\">" +
      "<div class=\"quiz-title\">" + u.quizTitle + "</div>" +
      "<div class=\"quiz-subtitle\">" + u.quizSub + "</div>" +
    "</div>" +
    "<div class=\"quiz-score-bar\">" +
      "<div class=\"quiz-score-item\"><div class=\"quiz-score-num\">" + quizScore + "</div><div class=\"quiz-score-lbl\">" + u.quizScore + "</div></div>" +
      "<div class=\"quiz-score-item\"><div class=\"quiz-score-num\">" + (quizIndex + 1) + "/" + quizQuestions.length + "</div><div class=\"quiz-score-lbl\">" + u.quizQ + "</div></div>" +
      "<div class=\"quiz-score-item\"><div class=\"quiz-score-num\">" + quizBestScore + "</div><div class=\"quiz-score-lbl\">" + u.quizBest + "</div></div>" +
    "</div>" +
    "<div class=\"quiz-progress\"><div class=\"quiz-progress-bar\" id=\"qpbar\" style=\"width:" + pct + "%\"></div></div>" +
    "<div class=\"quiz-question-card\">" +
      (q.flag ? "<span class=\"quiz-flag\">" + q.flag + "</span>" : "") +
      "<div class=\"quiz-question\">" + q.question + "</div>" +
      "<div class=\"quiz-choices\" id=\"qchoices\"></div>" +
      "<div class=\"quiz-feedback\" id=\"qfeedback\"></div>" +
      "<button class=\"quiz-next-btn\" id=\"qnext\" onclick=\"quizNext()\">" + u.quizNext + "</button>" +
    "</div>";

  // Render choices
  var choicesEl = document.getElementById("qchoices");
  q.choices.forEach(function(choice, i) {
    var btn = document.createElement("button");
    btn.className = "quiz-choice";
    btn.textContent = choice;
    btn.onclick = (function(idx){ return function(){ quizAnswer(idx); }; })(i);
    choicesEl.appendChild(btn);
  });
}

function quizAnswer(chosenIdx) {
  if (quizAnswered) return;
  quizAnswered = true;
  var q = quizQuestions[quizIndex];
  var correct = chosenIdx === q.correctIdx;
  if (correct) quizScore++;

  var buttons = document.querySelectorAll(".quiz-choice");
  buttons.forEach(function(btn, i) {
    if (i === q.correctIdx) {
      btn.classList.add("correct");
    } else if (i === chosenIdx && !correct) {
      btn.classList.add("wrong");
    } else {
      btn.classList.add("reveal");
    }
    btn.onclick = null;
  });

  var fb = document.getElementById("qfeedback");
  if (correct) {
    fb.textContent = lang === "fr" ? "✓ Bravo !" : "✓ Correct!";
    fb.style.color = "#80e080";
  } else {
    fb.textContent = lang === "fr"
      ? "✗ La bonne réponse était : " + q.choices[q.correctIdx]
      : "✗ The correct answer was: " + q.choices[q.correctIdx];
    fb.style.color = "#e08080";
  }

  var nextBtn = document.getElementById("qnext");
  if (nextBtn) nextBtn.classList.add("show");
}

function quizNext() {
  quizIndex++;
  renderQuizQuestion();
  var vquiz = document.getElementById("vquiz");
  if (vquiz) vquiz.scrollTop = 0;
}

function renderQuizEnd() {
  var u = UI[lang];
  if (quizScore > quizBestScore) {
    quizBestScore = quizScore;
    localStorage.setItem("quiz_best", quizBestScore);
  }
  var rank = quizScore >= 10 ? 3 : quizScore >= 7 ? 2 : quizScore >= 4 ? 1 : 0;
  var emoji = ["😅","🙂","😊","🏆"][rank];
  var rankLabel = u.quizRankings[rank];

  var wrap = document.getElementById("quizWrap");
  wrap.innerHTML =
    "<div class=\"quiz-header\">" +
      "<div class=\"quiz-title\">" + u.quizTitle + "</div>" +
    "</div>" +
    "<div class=\"quiz-end\">" +
      "<span class=\"quiz-end-emoji\">" + emoji + "</span>" +
      "<div class=\"quiz-end-score\">" + quizScore + " / " + quizQuestions.length + "</div>" +
      "<div class=\"quiz-end-label\">" + rankLabel + "</div>" +
      "<button class=\"quiz-restart\" onclick=\"startQuiz()\">" + u.quizRestart + "</button>" +
    "</div>";
}

function init() {
  renderPills();
  renderList();
  buildNosApps();
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

</script>
